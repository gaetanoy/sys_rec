[project]
name = "sys-rec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gaëtan Oueyeya", email = "gaetan.oueyeya@telecom-sudparis.eu" }
]
requires-python = ">=3.14"
dependencies = [
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "notebook>=7.6.5",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.scripts]
sys-rec = "sys_rec:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
